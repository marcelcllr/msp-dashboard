<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Secret Passion MX — Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', -apple-system, sans-serif; background: #FFFFFF; }
      input, select, button, textarea {
        font-family: inherit;
        font-size: 13px;
        border-radius: 6px;
        border: 1px solid rgba(196,150,42,0.25);
        padding: 6px 10px;
        outline: none;
        background: #fff;
        color: #1C1A16;
      }
      input:focus, select:focus { border-color: #C4962A; box-shadow: 0 0 0 2px rgba(196,150,42,0.15); }
      button { cursor: pointer; background: transparent; border: 1px solid rgba(196,150,42,0.25); padding: 6px 14px; }
      button:hover { opacity: 0.85; }
      #root { padding: 16px; max-width: 1200px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
